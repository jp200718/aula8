<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateleria</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Quicksand:wght@300&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
      <h1>GATELERIA</h1>
      <h2>
        <img src="img/minimalist-cat-silhouette-logo-design_1060494-109311.jpg" alt="">
        Galeria de Fotos
      </h2>
      <hr>
  </header>
  <main class="body">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
          <form class="d-flex" role="search">
            <input id="form-control" type="search" placeholder="Digite a raça do gato" aria-label="Search">
          </form>
        </div>
      </nav>
    <section id="cats"></section>

    <!-- para isso pedi ajuda a ia -->
    <div class="modal fade" id="catModal" tabindex="-1" aria-labelledby="catModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="catModalLabel">Detalhes da Raça</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="row">
              <div class="col-md-6">
                <img id="modalImage" src="" alt="" class="img-fluid">
              </div>
              <div class="col-md-6">
                <h3 id="modalName"></h3>
                <p id="modalDescription"></p>
                <div class="cat-details">
                  <p><strong>Temperamento:</strong> <span id="modalTemperament"></span></p>
                  <p><strong>Origem:</strong> <span id="modalOrigin"></span></p>
                  <p><strong>Expectativa de Vida:</strong> <span id="modalLifeSpan"></span></p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  
  <footer class="footer">
    <h5>&copy; 2025 galeria de fotos, todos os direitos reservados. </h5>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="text/javascript" src="script.js"></script>   
  
</body>

</html>
